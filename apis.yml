aid: silq
name: Silq
description: >-
  Silq (OneSilq) is a digital freight forwarder delivering fast, transparent
  global shipping and supply-chain services. Offerings span ocean freight
  (full container load, less-than-container load and shared container load),
  air freight, buyer's consolidation, cargo value protection, customs brokerage
  and trucking/drayage, plus quality-control inspections across China, India,
  Vietnam, Indonesia and Bangladesh. The platform layers real-time shipment
  visibility, live ocean-carrier freight rates, expert trade advisory and
  built-in risk protection for importers and small shippers.
